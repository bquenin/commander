                  - text: "- 617 comments"
                - paragraph [ref=e192]: Why would this be the Last release? Sure, few people are paying attention to this mod, but that is only because not too many people that play this game are keen on setting up GDI as an opponent. they tend to spam mammoth tanks and juggernauts very quickly. If this mod was re-calibrated for NOD use, and if you could somehow fix the mid to late-game glitch with the NOD harvesters (A glitch that affects EVERY other mod that is made for Tiberium Wars & Kanes Wrath respectively, regardless of difficulty settings), then I promise you, this mod will gain a lot more support, very quickly. or if you could fully Design a Scrin A.I. that would actually summon the mothership in mid-game before the P.A.C's, and continue to re-summon that mothership when the previous one dies, to make for a greater onslaught of alien forces, I'm sure Modders from other C&C TW mod projects will take interest in this. Please don't give up just because of a rough start.
